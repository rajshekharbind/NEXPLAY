<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E50914" />
      <stop offset="50%" stop-color="#00A8E1" />
      <stop offset="100%" stop-color="#1DB954" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="#0A0E1A" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#brandGrad)" opacity="0.15" />
  <rect x="24" y="24" width="464" height="464" rx="104" stroke="url(#brandGrad)" stroke-width="8" opacity="0.8" />

  <!-- Center 3D Play Entertainment Monogram -->
  <g filter="url(#glow)">
    <path d="M 200 156 L 368 256 L 200 356 Z" fill="url(#brandGrad)" />
    <path d="M 215 185 L 335 256 L 215 327 Z" fill="#FFFFFF" />
  </g>
</svg>
